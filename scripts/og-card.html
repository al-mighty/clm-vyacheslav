<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  body {
    width: 1200px; height: 630px;
    background: #0a0e1a;
    color: #f4f1ea;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  /* Background orbs */
  .orb1 {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: rgba(212, 255, 58, 0.10); filter: blur(100px);
    top: -20%; left: -5%;
  }
  .orb2 {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: rgba(255, 91, 58, 0.08); filter: blur(100px);
    bottom: -15%; right: 5%;
  }
  .orb3 {
    position: absolute; width: 350px; height: 350px; border-radius: 50%;
    background: rgba(100, 150, 255, 0.06); filter: blur(100px);
    top: 30%; left: 55%;
  }
  /* Accent line */
  .line {
    position: absolute; width: 3px; height: 100%;
    left: 60px; top: 0;
    background: linear-gradient(180deg, transparent 0%, #d4ff3a 30%, #ff5b3a 70%, transparent 100%);
    opacity: 0.6;
  }
  /* Content */
  .content {
    position: relative; z-index: 1;
    padding: 64px 80px 64px 100px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    width: 100%;
  }
  .top {}
  .eyebrow {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: #d4ff3a; margin-bottom: 24px; opacity: 0.8;
  }
  .name {
    font-size: 64px; font-weight: 500; line-height: 1;
    letter-spacing: -0.03em; margin-bottom: 12px;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .name em { font-style: italic; color: #d4ff3a; }
  .role {
    font-size: 20px; color: rgba(244,241,234,0.6); letter-spacing: 0.05em;
    margin-bottom: 32px;
  }
  .stats {
    display: flex; gap: 48px;
  }
  .stat-num {
    font-size: 40px; font-weight: 500; line-height: 1;
    font-family: Georgia, serif;
  }
  .stat-num em { font-style: italic; color: #d4ff3a; }
  .stat-lbl {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(244,241,234,0.4); margin-top: 6px;
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .tags {
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 700px;
  }
  .tag {
    font-size: 11px; letter-spacing: 0.03em;
    padding: 5px 12px; border: 1px solid rgba(212, 255, 58, 0.2);
    color: rgba(212, 255, 58, 0.7);
  }
  .url {
    font-size: 13px; color: rgba(244,241,234,0.3); letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="orb3"></div>
  <div class="line"></div>
  <div class="content">
    <div class="top">
      <div class="eyebrow">Portfolio &middot; Detail Aid</div>
      <div class="name">Vyacheslav <em>Kovalev.</em></div>
      <div class="role">Senior Fullstack Engineer</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-num"><em>11+</em></div>
          <div class="stat-lbl">Years in production</div>
        </div>
        <div class="stat">
          <div class="stat-num">10+</div>
          <div class="stat-lbl">Highload APIs</div>
        </div>
        <div class="stat">
          <div class="stat-num">10</div>
          <div class="stat-lbl">Companies</div>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="tags">
        <span class="tag">Node.js</span>
        <span class="tag">TypeScript</span>
        <span class="tag">React</span>
        <span class="tag">NestJS</span>
        <span class="tag">PostgreSQL</span>
        <span class="tag">Kafka</span>
        <span class="tag">Docker</span>
        <span class="tag">k8s</span>
        <span class="tag">Python</span>
        <span class="tag">AI / LLM</span>
      </div>
      <div class="url">cheslav.space</div>
    </div>
  </div>
</body>
</html>
