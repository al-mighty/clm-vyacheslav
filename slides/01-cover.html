<!--
  Slide 01 · Cover
  
  Modular version. Used in Veeva CLM build where each slide is isolated.
  Self-contained: includes its own template + scoped styles + minimal JS.
  
  Token references (--bg, --accent etc) come from /shared/styles/tokens.css.
-->

<link rel="stylesheet" href="../shared/styles/tokens.css">
<link rel="stylesheet" href="../shared/styles/base.css">

<style>
  .cover { 
    height: 100vh;
    padding: 48px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cover-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .cover-name {
    font-family: var(--serif);
    font-size: clamp(64px, 10vw, 140px);
    line-height: 0.9;
    font-weight: 300;
    letter-spacing: -0.04em;
  }
  .cover-name em { font-style: italic; font-weight: 500; color: var(--accent); }
  .cover-tagline {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--ink-dim);
    max-width: 280px;
    text-align: right;
    line-height: 1.6;
  }
  .cover-foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .cover-stats { display: flex; gap: 64px; }
  .cover-stat .num {
    font-size: 56px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    font-family: var(--serif);
  }
  .cover-stat .num em { font-style: italic; color: var(--accent); }
  .cover-stat .lbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 8px;
  }
  .cover-cta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 12px 20px;
    cursor: pointer;
    background: transparent;
    transition: all 0.3s;
  }
  .cover-cta:hover { background: var(--accent); color: var(--bg); }
</style>

<section class="cover">
  <div class="cover-top">
    <div class="cover-name">
      Vyacheslav<br>
      <em>Kovalev.</em>
    </div>
    <div class="cover-tagline">
      Senior Fullstack Engineer<br>
      Node.js · React · Microservices<br>
      St. Petersburg, RU
    </div>
  </div>
  <div class="cover-foot">
    <div class="cover-stats">
      <div class="cover-stat">
        <div class="num"><em>10+</em></div>
        <div class="lbl">Years in production</div>
      </div>
      <div class="cover-stat">
        <div class="num">6M+</div>
        <div class="lbl">Users served (Dom.ru)</div>
      </div>
      <div class="cover-stat">
        <div class="num">8</div>
        <div class="lbl">Companies / projects</div>
      </div>
    </div>
    <button class="cover-cta" onclick="parent.postMessage({type: 'next-slide'}, '*')">START DETAIL →</button>
  </div>
</section>
