<!--
  Slide 02 · Three Pillars
  Tap each card to expand. Tracks pillar_expand events.
-->

<link rel="stylesheet" href="../shared/styles/tokens.css">
<link rel="stylesheet" href="../shared/styles/base.css">

<style>
  .slide { height: 100vh; padding: 48px 80px; display: flex; flex-direction: column; }
  .pillars-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 32px;
    flex: 1;
  }
  .pillar {
    border: 1px solid var(--line);
    padding: 32px 28px;
    cursor: pointer;
    transition: all 0.4s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(180deg, transparent, rgba(244, 241, 234, 0.02));
    position: relative;
    overflow: hidden;
  }
  .pillar::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s var(--ease-out);
  }
  .pillar:hover { border-color: var(--line-2); transform: translateY(-4px); }
  .pillar:hover::before { transform: scaleX(1); }
  .pillar.expanded {
    border-color: var(--accent);
    background: rgba(212, 255, 58, 0.04);
  }
  .pillar.expanded::before { transform: scaleX(1); }

  .pillar-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink-dim); }
  .pillar-title {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    line-height: 1.05;
    margin: 24px 0 12px;
    letter-spacing: -0.01em;
  }
  .pillar-title em { font-style: italic; color: var(--accent); }
  .pillar-desc { font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
  .pillar-detail {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    line-height: 1.7;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.5s, opacity 0.3s;
    white-space: pre-line;
  }
  .pillar.expanded .pillar-detail { max-height: 200px; opacity: 1; }
</style>

<section class="slide">
  <div class="slide-num">02 / 08</div>
  <div class="slide-eyebrow">Core competencies</div>
  <h2>Three engineering <em>pillars</em>.</h2>
  <p class="lead" style="margin-bottom: 24px;">Tap each card to expand.</p>
  <div class="pillars-grid" id="pillars"></div>
</section>

<script type="module">
  import tracking from '../shared/tracking/veeva-clm.js';

  const pillars = [
    {
      title: 'Backend',
      titleEm: 'at scale.',
      desc: 'Microservices, REST/GraphQL, event-driven architecture with Kafka and RabbitMQ.',
      detail: '// NestJS · TypeScript · Postgres · Mongo\n// 6+ years, 5+ production microservice systems\n// OpenAPI-first, RBAC, highload-tested'
    },
    {
      title: 'Frontend',
      titleEm: 'with taste.',
      desc: 'React, Next.js, Vue. SSR, design systems, Storybook, real component libraries shipped to teams.',
      detail: '// React 6+ · Next.js 4+ · Vue 2+\n// Component libraries published to npm\n// Owned UI architecture on multi-team products'
    },
    {
      title: 'DevOps',
      titleEm: '& delivery.',
      desc: 'GitLab CI multi-stage pipelines, Docker, Kubernetes, isolated environments, automated releases.',
      detail: '// k8s · Docker · GitLab CI · Jenkins\n// Built release automation with AI agents at Sber\n// SSL auto-renewal, container registries'
    }
  ];

  const container = document.getElementById('pillars');
  pillars.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'pillar';
    el.innerHTML = `
      <div>
        <div class="pillar-num">${String(i + 1).padStart(2, '0')}</div>
        <h3 class="pillar-title">${p.title} <em>${p.titleEm}</em></h3>
        <div class="pillar-desc">${p.desc}</div>
      </div>
      <div class="pillar-detail">${p.detail}</div>
    `;
    el.addEventListener('click', () => {
      const wasExpanded = el.classList.contains('expanded');
      document.querySelectorAll('.pillar').forEach(p => p.classList.remove('expanded'));
      if (!wasExpanded) {
        el.classList.add('expanded');
        tracking.pillarExpand(i);
      }
    });
    container.appendChild(el);
  });

  tracking.slideView('02-pillars', 'Three Pillars');
</script>
