<!--
  Slide 03 · Career Timeline
  Animated horizontal timeline with progress bar.
  Data and animation driven by vanilla JS (no Vue CDN needed).
-->

<link rel="stylesheet" href="../shared/styles/tokens.css">
<link rel="stylesheet" href="../shared/styles/base.css">

<style>
  .slide {
    height: 100vh;
    padding: 48px 80px;
    display: flex;
    flex-direction: column;
  }
  .timeline {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    padding: 40px 0;
  }
  .timeline-track {
    position: relative;
    height: 2px;
    background: var(--line);
    margin: 80px 0;
  }
  .timeline-progress {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    width: 0;
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .timeline-points {
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
  }
  .tl-point {
    position: relative;
    cursor: pointer;
  }
  .tl-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--line-2);
    transition: all 0.3s;
  }
  .tl-point.reached .tl-dot {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(212, 255, 58, 0.4);
  }
  .tl-point:hover .tl-dot { transform: scale(1.3); }
  .tl-label {
    position: absolute;
    top: -56px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 140px;
  }
  .tl-label.below { top: 28px; }
  .tl-year { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.15em; }
  .tl-place { font-family: var(--serif); font-size: 16px; font-weight: 500; line-height: 1.2; margin-top: 4px; }
  .tl-role { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); margin-top: 2px; }
</style>

<section class="slide">
  <div class="slide-num">03 / 08</div>
  <div class="slide-eyebrow">Career path</div>
  <h2>From <em>PHP</em> to AI agents &mdash; a deliberate trajectory.</h2>
  <div class="timeline">
    <div class="timeline-track">
      <div class="timeline-progress" id="tl-progress"></div>
      <div class="timeline-points" id="tl-points"></div>
    </div>
  </div>
</section>

<script type="module">
  import tracking from '../shared/tracking/veeva-clm.js';

  const timeline = [
    { year: '2015', place: 'Это элементарно', role: 'PHP / Symfony' },
    { year: '2017', place: 'Intercomp', role: 'PHP / Phalcon' },
    { year: '2018', place: 'PLC.01', role: 'Fullstack' },
    { year: '2020', place: 'FutureComes', role: 'Next + Nest' },
    { year: '2021', place: 'Ситидрайв', role: 'Backend / Node' },
    { year: '2022', place: 'Дом.ру', role: 'Senior · 6M users' },
    { year: '2025', place: 'Сбер', role: 'AI Systems' }
  ];

  const container = document.getElementById('tl-points');
  timeline.forEach((t, i) => {
    const point = document.createElement('div');
    point.className = 'tl-point reached';
    point.innerHTML = `
      <div class="tl-dot"></div>
      <div class="tl-label${i % 2 === 1 ? ' below' : ''}">
        <div class="tl-year">${t.year}</div>
        <div class="tl-place">${t.place}</div>
        <div class="tl-role">${t.role}</div>
      </div>
    `;
    container.appendChild(point);
  });

  // Animate progress bar on load
  requestAnimationFrame(() => {
    document.getElementById('tl-progress').style.width = '100%';
  });

  tracking.slideView('03-timeline', 'Career Timeline');
</script>
