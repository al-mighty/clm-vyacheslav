<!--
  Slide 04 · Tech Stack by Years
  Animated horizontal bars showing production experience per technology.
-->

<link rel="stylesheet" href="../shared/styles/tokens.css">
<link rel="stylesheet" href="../shared/styles/base.css">

<style>
  .slide {
    height: 100vh;
    padding: 48px 80px;
    display: flex;
    flex-direction: column;
  }
  .stack-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 64px;
    flex: 1;
  }
  .stack-side h2 { margin-bottom: 24px; }
  .stack-side p { color: var(--ink-dim); font-size: 16px; }
  .stack-bars {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-self: center;
  }
  .stack-bar {
    display: grid;
    grid-template-columns: 140px 1fr 60px;
    gap: 16px;
    align-items: center;
    cursor: pointer;
  }
  .stack-bar-name {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    letter-spacing: 0.05em;
  }
  .stack-bar-track {
    height: 6px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .stack-bar-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: linear-gradient(90deg, var(--accent), #a8d92a);
    width: 0;
    transition: width 1.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .stack-bar.alt .stack-bar-fill {
    background: linear-gradient(90deg, var(--accent-2), #d44a2a);
  }
  .stack-bar-years {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-align: right;
  }
  .stack-bar:hover .stack-bar-name { color: var(--accent); }
</style>

<section class="slide">
  <div class="slide-num">04 / 08</div>
  <div class="slide-eyebrow">Technology depth</div>
  <div class="stack-layout">
    <div class="stack-side">
      <h2>Stack <em>by</em> years.</h2>
      <p>Real production exposure, not weekend tutorials. Every bar represents shipped systems serving real users at scale.</p>
    </div>
    <div class="stack-bars" id="stack-bars"></div>
  </div>
</section>

<script type="module">
  import tracking from '../shared/tracking/veeva-clm.js';

  const stack = [
    { name: 'Node.js', years: 7, alt: false },
    { name: 'NestJS', years: 6, alt: false },
    { name: 'TypeScript', years: 6, alt: false },
    { name: 'React', years: 6, alt: false },
    { name: 'PostgreSQL', years: 6, alt: true },
    { name: 'MongoDB', years: 6, alt: true },
    { name: 'Docker', years: 6, alt: false },
    { name: 'Redis', years: 5, alt: true },
    { name: 'Next.js', years: 4, alt: false },
    { name: 'RabbitMQ', years: 4, alt: true },
    { name: 'Kafka', years: 3, alt: true },
    { name: 'Kubernetes', years: 3, alt: false }
  ];

  const maxYears = 7;
  const container = document.getElementById('stack-bars');

  stack.forEach((s, i) => {
    const bar = document.createElement('div');
    bar.className = 'stack-bar' + (s.alt ? ' alt' : '');
    bar.innerHTML = `
      <div class="stack-bar-name">${s.name}</div>
      <div class="stack-bar-track">
        <div class="stack-bar-fill" id="bar-${i}"></div>
      </div>
      <div class="stack-bar-years">${s.years}+ yrs</div>
    `;
    container.appendChild(bar);
  });

  // Animate bars on load with staggered delay
  requestAnimationFrame(() => {
    stack.forEach((s, i) => {
      const fill = document.getElementById(`bar-${i}`);
      const pct = Math.min(100, (s.years / maxYears) * 100);
      fill.style.transitionDelay = `${i * 60}ms`;
      fill.style.width = `${pct}%`;
    });
  });

  tracking.slideView('04-stack', 'Tech Stack');
</script>
