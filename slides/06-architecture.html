<!--
  Slide 06 · Architecture Detail · Interactive Hot-spots
  The most CLM-style slide: pulsing SVG hotspots + contextual detail panels.
  Each hotspot click is tracked via veeva-clm.js.
-->

<link rel="stylesheet" href="../shared/styles/tokens.css">
<link rel="stylesheet" href="../shared/styles/base.css">

<style>
  .slide {
    height: 100vh;
    padding: 48px 80px;
    display: flex;
    flex-direction: column;
  }
  .hotspot-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    flex: 1;
  }
  .hotspot-img-wrap {
    border: 1px solid var(--line);
    background: var(--bg-2);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hotspot-svg { width: 100%; height: 100%; }

  .hs-circle {
    fill: var(--accent);
    cursor: pointer;
    animation: hsRing 2s ease-out infinite;
    transform-origin: center;
  }
  @keyframes hsRing {
    0% { r: 8; opacity: 1; }
    100% { r: 24; opacity: 0; }
  }
  .hs-core {
    fill: var(--accent);
    cursor: pointer;
    transition: fill 0.3s;
  }
  .hs-core.active { fill: var(--accent-2); }
  .hs-core:hover { fill: var(--accent-2); }

  .hotspot-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hs-detail {
    border-left: 2px solid var(--accent);
    padding-left: 24px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s;
    height: 0;
    overflow: hidden;
  }
  .hs-detail.active {
    opacity: 1;
    transform: translateY(0);
    height: auto;
  }
  .hs-detail h4 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .hs-detail h4 em { font-style: italic; color: var(--accent); }
  .hs-detail p { color: var(--ink-dim); font-size: 15px; line-height: 1.55; }
  .hs-prompt {
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
  }
</style>

<section class="slide">
  <div class="slide-num">06 / 08</div>
  <div class="slide-eyebrow">Architecture detail &middot; Interactive</div>
  <h2>Anatomy of a <em>highload</em> service.</h2>
  <p class="hs-prompt" style="margin-bottom: 16px;">&rarr; Tap hotspots on diagram</p>
  <div class="hotspot-layout">
    <div class="hotspot-img-wrap">
      <svg class="hotspot-svg" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
        <!-- backdrop nodes -->
        <rect x="40" y="40" width="120" height="50" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <text x="100" y="70" text-anchor="middle" fill="#8b94a8" font-family="JetBrains Mono" font-size="11">Client / Web</text>

        <rect x="240" y="40" width="120" height="50" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <text x="300" y="70" text-anchor="middle" fill="#8b94a8" font-family="JetBrains Mono" font-size="11">CDN · Nginx</text>

        <rect x="140" y="135" width="120" height="50" fill="none" stroke="#d4ff3a" stroke-width="1"/>
        <text x="200" y="166" text-anchor="middle" fill="#d4ff3a" font-family="JetBrains Mono" font-size="11">NestJS API</text>

        <rect x="40" y="240" width="100" height="50" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <text x="90" y="270" text-anchor="middle" fill="#8b94a8" font-family="JetBrains Mono" font-size="11">Postgres</text>

        <rect x="160" y="240" width="80" height="50" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <text x="200" y="270" text-anchor="middle" fill="#8b94a8" font-family="JetBrains Mono" font-size="11">Redis</text>

        <rect x="260" y="240" width="100" height="50" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <text x="310" y="270" text-anchor="middle" fill="#8b94a8" font-family="JetBrains Mono" font-size="11">Kafka</text>

        <!-- connectors -->
        <line x1="100" y1="90" x2="180" y2="135" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <line x1="300" y1="90" x2="220" y2="135" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <line x1="180" y1="185" x2="100" y2="240" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <line x1="200" y1="185" x2="200" y2="240" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>
        <line x1="220" y1="185" x2="300" y2="240" stroke="rgba(244,241,234,0.16)" stroke-width="1"/>

        <!-- HOTSPOT pulsing rings (behind clickable cores) -->
        <circle cx="200" cy="160" r="8" class="hs-circle"/>
        <circle cx="90" cy="265" r="8" class="hs-circle"/>
        <circle cx="200" cy="265" r="8" class="hs-circle"/>
        <circle cx="310" cy="265" r="8" class="hs-circle"/>

        <!-- HOTSPOT clickable cores -->
        <circle cx="200" cy="160" r="8" class="hs-core" data-idx="0"/>
        <circle cx="90" cy="265" r="8" class="hs-core" data-idx="1"/>
        <circle cx="200" cy="265" r="8" class="hs-core" data-idx="2"/>
        <circle cx="310" cy="265" r="8" class="hs-core" data-idx="3"/>
      </svg>
    </div>
    <div class="hotspot-info" id="hs-info">
      <div class="hs-prompt" id="hs-default">// click any pulsing node &rarr;</div>
    </div>
  </div>
</section>

<script type="module">
  import tracking from '../shared/tracking/veeva-clm.js';

  const hotspots = [
    {
      title: 'NestJS', titleEm: 'core.',
      desc: 'Modular DI-based architecture. Each subdomain has its own module with controllers, services, guards. RBAC via CASL, validation via class-validator, OpenAPI generated from decorators.'
    },
    {
      title: 'Postgres', titleEm: 'storage.',
      desc: 'Primary storage. Partial indexes for hot filters, date-based partitioning on event tables, read replicas for heavy reports, migrations via Liquibase / Prisma.'
    },
    {
      title: 'Redis', titleEm: 'cache.',
      desc: 'Session store, sliding-window rate limiting, BullMQ for deferred jobs, Pub/Sub for coordination between instances of the same service.'
    },
    {
      title: 'Kafka', titleEm: 'bus.',
      desc: 'Event bus between services. Domain events with schemas, idempotent handlers with event_id deduplication, dead-letter topics for retry logic.'
    }
  ];

  const infoContainer = document.getElementById('hs-info');
  const defaultPrompt = document.getElementById('hs-default');

  // Build detail panels
  hotspots.forEach((h, i) => {
    const panel = document.createElement('div');
    panel.className = 'hs-detail';
    panel.id = `hs-panel-${i}`;
    panel.innerHTML = `<h4>${h.title} <em>${h.titleEm}</em></h4><p>${h.desc}</p>`;
    infoContainer.appendChild(panel);
  });

  let activeIdx = null;

  document.querySelectorAll('.hs-core').forEach(core => {
    core.addEventListener('click', () => {
      const idx = parseInt(core.dataset.idx);

      // Reset all
      document.querySelectorAll('.hs-core').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.hs-detail').forEach(d => d.classList.remove('active'));

      // Activate
      core.classList.add('active');
      document.getElementById(`hs-panel-${idx}`).classList.add('active');
      defaultPrompt.style.display = 'none';

      activeIdx = idx;
      tracking.hotspotClick('06-architecture', hotspots[idx].title);
    });
  });

  tracking.slideView('06-architecture', 'Architecture Interactive');
</script>
